# ============================================================================
#  Compilación automática de Studoo para Windows y Linux.
#  Cada vez que se suben cambios a GitHub, GitHub compila la app en sus
#  propios ordenadores y deja los programas listos para descargar
#  (pestaña "Actions" del repositorio -> la ejecución más reciente -> "Artifacts").
# ============================================================================
name: Compilar Studoo

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (por ejemplo 1.0.0). Déjalo vacío para solo compilar."
        required: false
        default: ""
      reemplazar:
        description: "Si esa versión ya existe en Releases, sustituirla por esta (mismo número de versión)"
        type: boolean
        required: false
        default: false

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        timeout-minutes: 20
        run: |
          # Si la red de GitHub falla, se reintenta varias veces
          for intento in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && \
            sudo apt-get -o Acquire::Retries=3 install -y ninja-build libasound2-dev libjack-jackd2-dev \
              libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
              libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libgl1-mesa-dev && break
            echo "Fallo de red, reintento $intento..."; sleep 30
            if [ $intento = 5 ]; then exit 1; fi
          done

      - name: Configurar
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTUDOO_BUILD_TESTS=ON

      - name: Compilar
        run: cmake --build build

      - name: Pruebas del motor de audio
        run: ./build/StudooEngineTest_artefacts/Release/StudooEngineTest

      - name: Empaquetar
        run: |
          mkdir -p Studoo-Linux
          cp build/Studoo_artefacts/Release/Studoo Studoo-Linux/
          cp packaging/linux/instalar.sh packaging/linux/desinstalar.sh packaging/linux/studoo.png Studoo-Linux/
          chmod +x Studoo-Linux/Studoo Studoo-Linux/*.sh
          tar -czf Studoo-Linux.tar.gz Studoo-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: Studoo-Linux
          path: Studoo-Linux.tar.gz

      - name: Crear instalador .deb (Ubuntu, Linux Mint, Debian)
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ]; then V="0.0.0~dev"; fi
          packaging/linux/build-deb.sh build/Studoo_artefacts/Release/Studoo "$V" dist
          dpkg-deb --info dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Studoo-Linux-deb
          path: dist/*.deb

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DSTUDOO_BUILD_TESTS=ON

      - name: Compilar
        run: cmake --build build --config Release

      - name: Pruebas del motor de audio
        run: .\build\StudooEngineTest_artefacts\Release\StudooEngineTest.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Studoo-Windows
          path: build/Studoo_artefacts/Release/Studoo.exe

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v -and "${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".Substring(1) }
          if (-not $v) { $v = "0.0.0-dev" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DMyAppVersion=$v" "/DSourceExe=$PWD\build\Studoo_artefacts\Release\Studoo.exe" "/O$PWD\dist" packaging\windows\studoo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: Studoo-Windows-Instalador
          path: dist/Studoo-Instalador.exe

  # --------------------------------------------------------------------------
  #  Publicar un "Release" (descarga directa) cuando se sube una etiqueta
  #  de versión, por ejemplo v1.0.0
  # --------------------------------------------------------------------------
  android:
    name: Android (tablet)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias (para compilar Projucer)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libfreetype-dev \
              libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
              libxrandr-dev libxrender-dev libgl1-mesa-dev && break
            echo "Reintentando ($i)..."; sleep 15
          done

      - name: Descargar JUCE
        run: git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git packaging/android/JUCE

      - name: Compilar Projucer
        run: |
          cmake -S packaging/android/JUCE -B projucer-build -G Ninja -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build projucer-build --target Projucer

      - name: Crear el proyecto de Android
        run: |
          python3 packaging/android/generate_jucer.py
          projucer-build/extras/Projucer/Projucer_artefacts/Release/Projucer --resave packaging/android/Studoo.jucer

      - name: Instalar NDK y CMake de Android
        run: |
          NDK=$(sed -n 's/.*ndkVersionString = "\(.*\)".*/\1/p' packaging/android/Builds/Android/app/build.gradle)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;3.22.1" > /dev/null

      # La firma de la app. Si el repositorio tiene el secreto ANDROID_KEYSTORE_BASE64 (una clave
      # creada con contraseña "android" y alias "studoo"), se usa siempre la misma; si no, se crea una.
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > ~/.android/studoo.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/studoo.keystore -storepass android -keypass android \
              -alias studoo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Studoo, O=Studoo, C=ES"
          fi

      - name: Compilar la app (APK)
        working-directory: packaging/android/Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/dist/Studoo-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Studoo-Android
          path: dist/Studoo-Android.apk

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Nombre de la versión
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "TAG=v${{ inputs.version }}" >> $GITHUB_ENV; else echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV; fi

      - name: Preparar archivos
        run: |
          mkdir -p Studoo-Windows
          cp artifacts/Studoo-Windows/Studoo.exe Studoo-Windows/
          cp README.md Studoo-Windows/LEEME.md
          zip -r Studoo-${{ env.TAG }}-Windows.zip Studoo-Windows
          cp artifacts/Studoo-Linux/Studoo-Linux.tar.gz Studoo-${{ env.TAG }}-Linux.tar.gz
          cp artifacts/Studoo-Windows-Instalador/Studoo-Instalador.exe Studoo-${{ env.TAG }}-Instalador-Windows.exe
          cp artifacts/Studoo-Linux-deb/*.deb Studoo-${{ env.TAG }}-Linux.deb
          cp artifacts/Studoo-Android/Studoo-Android.apk Studoo-${{ env.TAG }}-Android.apk

      - name: Reemplazar la versión si ya existe
        if: inputs.reemplazar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - uses: softprops/action-gh-release@v2
        with:
          name: Studoo ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            Studoo-${{ env.TAG }}-Instalador-Windows.exe
            Studoo-${{ env.TAG }}-Windows.zip
            Studoo-${{ env.TAG }}-Linux.deb
            Studoo-${{ env.TAG }}-Linux.tar.gz
            Studoo-${{ env.TAG }}-Android.apk
